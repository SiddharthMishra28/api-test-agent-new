<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI API Tester</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #00aaff;
            --background-color: #1a1a1a;
            --text-color: #e0e0e0;
            --card-background: #2a2a2a;
            --border-color: #444;
            --spinner-color: var(--primary-color);
        }
        body {
            font-family: 'Roboto Mono', monospace;
            margin: 0;
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 90%;
            max-width: 800px;
            padding: 40px;
            background-color: var(--card-background);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: var(--primary-color);
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        label {
            font-weight: 700;
            color: var(--primary-color);
        }
        input[type="file"], textarea, button {
            font-family: 'Roboto Mono', monospace;
            font-size: 16px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #333;
            color: var(--text-color);
            transition: all 0.3s ease;
        }
        input[type="file"]::-webkit-file-upload-button {
            background: var(--primary-color);
            color: var(--background-color);
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        textarea:focus, button:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px var(--primary-color);
        }
        button {
            background-color: var(--primary-color);
            color: var(--background-color);
            font-weight: 700;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #0077b3;
            box-shadow: 0 0 15px var(--primary-color);
        }
        #spinner {
            display: none;
            margin: 20px auto;
            width: 50px;
            height: 50px;
            border: 5px solid #555;
            border-top: 5px solid var(--spinner-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #results {
            margin-top: 30px;
            text-align: center;
        }
        #results a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI API Tester</h1>
        <form id="test-form">
            <div>
                <label for="spec">OpenAPI Spec (optional)</label>
                <input type="file" id="spec" name="spec">
            </div>
            <div>
                <label for="instruction">Test Instruction</label>
                <textarea id="instruction" name="instruction" rows="5" required></textarea>
            </div>
            <button type="submit">Run Test</button>
        </form>
        <div id="spinner"></div>
        <div id="results"></div>
    </div>
    <script>
        const form = document.getElementById('test-form');
        const resultsDiv = document.getElementById('results');
        const spinner = document.getElementById('spinner');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            resultsDiv.innerHTML = '';
            spinner.style.display = 'block';

            const formData = new FormData(form);
            let specId = null;

            if (formData.get('spec').size > 0) {
                const specUploadData = new FormData();
                specUploadData.append('spec', formData.get('spec'));

                try {
                    const specRes = await fetch('/upload-spec', {
                        method: 'POST',
                        body: specUploadData,
                    });
                    if (!specRes.ok) {
                        throw new Error('Failed to upload spec file.');
                    }
                    const specData = await specRes.json();
                    specId = specData.specId;
                } catch (error) {
                    resultsDiv.innerHTML = `<p style="color: red;">${error.message}</p>`;
                    spinner.style.display = 'none';
                    return;
                }
            }

            try {
                const testRes = await fetch('/run-test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        instruction: formData.get('instruction'),
                        specId: specId,
                    }),
                });

                if (!testRes.ok) {
                    throw new Error('Failed to run test.');
                }

                const testData = await testRes.json();
                const reportName = testData.reportPath.split('/').pop();

                resultsDiv.innerHTML = `
                    <h2>Test Complete</h2>
                    <p><strong>Status:</strong> ${testData.report.summary.status}</p>
                    <p><a href="/report/${reportName}" target="_blank">View Full Report</a></p>
                `;
            } catch (error) {
                resultsDiv.innerHTML = `<p style="color: red;">${error.message}</p>`;
            } finally {
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
